version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oquv_markaz
      POSTGRES_USER: oquv_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oquv_user -d oquv_markaz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://oquv_user:${DB_PASSWORD:-changeme}@db:5432/oquv_markaz
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-change-this}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-change-this}
      EXTRA_CORS_ORIGINS: ${EXTRA_CORS_ORIGINS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin2026!x}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # React Frontend + Nginx Reverse Proxy
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

  # Telegram Bot
  telegram-bot:
    build: ../telegram_bot
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
